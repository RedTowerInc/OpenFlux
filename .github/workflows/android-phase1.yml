name: Android Phase 1

on:
  push:
    branches: ["openflux-android"]
  workflow_dispatch:

jobs:
  test-and-build-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Build OpenFlux AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          MOBILE_VERSION=v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION
          go get -tool golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION
          gomobile init
          mkdir -p output/android/mobile
          # github.com/wlynxg/anet intentionally uses go:linkname to patch the
          # Android net package. Go 1.23+ requires checklinkname to be disabled
          # for this package; this is the build mode documented by anet.
          gomobile bind \
            -target=android \
            -androidapi 26 \
            -ldflags="-checklinkname=0" \
            -o output/android/mobile/openflux.aar \
            ./mobile

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-aar
          path: output/android/mobile/openflux.aar
          if-no-files-found: error
