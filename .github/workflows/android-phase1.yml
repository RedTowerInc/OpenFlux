name: Android APK

on:
  push:
    branches: ["openflux-android"]
  workflow_dispatch:

jobs:
  test-build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Go core
        run: go test ./...

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Build OpenFlux AAR
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          MOBILE_VERSION=v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION
          go get -tool golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION
          gomobile init
          mkdir -p output/android/mobile
          gomobile bind \
            -target=android \
            -androidapi 26 \
            -ldflags="-checklinkname=0" \
            -o output/android/mobile/openflux.aar \
            ./mobile
          cp output/android/mobile/openflux.aar android-app/app/libs/openflux.aar

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-aar
          path: output/android/mobile/openflux.aar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: openflux-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
