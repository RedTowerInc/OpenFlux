plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openflux.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openflux.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0-tun2socks'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // tun2socks is executed from nativeLibraryDir, so it must be
            // extracted as an executable file instead of kept inside the APK.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation files('libs/openflux.aar')
}
