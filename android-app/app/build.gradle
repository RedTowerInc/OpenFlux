plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openflux.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openflux.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation files('libs/openflux.aar')
}
